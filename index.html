    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #fff;
        color: #111;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      main {
        padding: 2rem;
        max-width: 480px;
        width: 100%;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 500;
        color: #111;
      }

      .header-text { flex: 1; }

      .tagline {
        font-size: 0.8rem;
        color: #888;
        margin-top: 0.15rem;
      }

      .social-links {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      .linkedin, .github {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        text-decoration: none;
        opacity: 0.75;
        transition: opacity 0.15s;
      }

      .linkedin:hover, .github:hover { opacity: 1; filter: none; }

      .linkedin img, .github img { display: block; border-radius: 3px; }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      a {
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.875rem;
        padding: 0.875rem 1rem;
        border-radius: 8px;
        border: 1px solid transparent;
        transition: filter 0.15s;
      }

      a:hover { filter: brightness(0.93); }

      /* Nina CSR — deep maroon */
      a.nina {
        background: #7f1d1d;
        color: #fff;
        border-color: #991b1b;
      }
      a.nina .project-desc { color: #fecaca; }
      a.nina .arrow { color: #fca5a5; }

      /* Ludex — amber */
      a.ludex {
        background: #fffbeb;
        color: #78350f;
        border-color: #fcd34d;
      }
      a.ludex .project-desc { color: #b45309; }
      a.ludex .arrow { color: #d97706; }

      /* Earmarked — dark vinyl */
      a.earmarked {
        background: #111111;
        color: #faf6ef;
        border-color: #333;
      }
      a.earmarked .project-desc { color: #999; }
      a.earmarked .arrow { color: #c0392b; }

      .icon {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon img, .icon svg {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .project-name {
        font-size: 1rem;
        font-weight: 500;
      }

      .project-desc {
        font-size: 0.8rem;
        margin-top: 0.2rem;
      }

      .arrow {
        font-size: 0.85rem;
        flex-shrink: 0;
        margin-left: auto;
      }
    </style>
  </head>
  <body>

                <rect x="36" y="12" width="7" height="13" rx="2" fill="white"/>

    </main>
