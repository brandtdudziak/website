<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brandt Dudziak</title>
    <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #fff;
        color: #111;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      main {
        padding: 2rem;
        max-width: 480px;
        width: 100%;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 500;
        color: #111;
      }

      .linkedin {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: #0077b5;
        color: #fff;
        text-decoration: none;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        flex-shrink: 0;
        transition: background 0.15s;
      }

      .linkedin:hover { background: #005f8e; filter: none; }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      a {
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.875rem;
        padding: 0.875rem 1rem;
        border-radius: 8px;
        border: 1px solid transparent;
        transition: filter 0.15s;
      }

      a:hover { filter: brightness(0.93); }

      /* Nina CSR — deep maroon */
      a.nina {
        background: #3b1010;
        color: #fff;
        border-color: #5a1a1a;
      }
      a.nina .project-desc { color: #e0c0c0; }
      a.nina .arrow { color: #c07070; }

      /* Ludex — amber */
      a.ludex {
        background: #fffbeb;
        color: #78350f;
        border-color: #fcd34d;
      }
      a.ludex .project-desc { color: #b45309; }
      a.ludex .arrow { color: #d97706; }

      /* Earmarked — dark vinyl */
      a.earmarked {
        background: #111111;
        color: #faf6ef;
        border-color: #333;
      }
      a.earmarked .project-desc { color: #999; }
      a.earmarked .arrow { color: #c0392b; }

      .icon {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon img, .icon svg {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .project-name {
        font-size: 1rem;
        font-weight: 500;
      }

      .project-desc {
        font-size: 0.8rem;
        margin-top: 0.2rem;
      }

      .arrow {
        font-size: 0.85rem;
        flex-shrink: 0;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="header">
        <h1>Brandt Dudziak</h1>
        <a href="https://www.linkedin.com/in/brandt-dudziak/" target="_blank" class="linkedin">in</a>
      </div>
      <ul>
        <li>
          <a href="https://ninacsr.com" target="_blank" class="nina">
            <div class="icon">
              <img src="./images/nina-favicon.jpg" alt="">
            </div>
            <div>
              <div class="project-name">Nina CSR</div>
              <div class="project-desc">Website for a court reporting service</div>
            </div>
            <span class="arrow">↗</span>
          </a>
        </li>
        <li>
          <a href="https://ludex.brandtdudziak.com" target="_blank" class="ludex">
            <div class="icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 22 22">
                <polygon points="16,6.1 20.7,8.8 20.7,14.2 16,16.9 11.3,14.2 11.3,8.8" fill="#d97706"/>
                <polygon points="10.8,15.1 15.5,17.8 15.5,23.2 10.8,25.9 6.1,23.2 6.1,17.8" fill="#d97706"/>
                <polygon points="21.2,15.1 25.9,17.8 25.9,23.2 21.2,25.9 16.5,23.2 16.5,17.8" fill="#d97706"/>
              </svg>
            </div>
            <div>
              <div class="project-name">Ludex</div>
              <div class="project-desc">Personal BoardGameGeek collection viewer</div>
            </div>
            <span class="arrow">↗</span>
          </a>
        </li>
        <li>
          <a href="https://earmarked.brandtdudziak.com" target="_blank" class="earmarked">
            <div class="icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 88 88">
                <defs>
                  <clipPath id="vinyl-clip">
                    <circle cx="50" cy="50" r="44"/>
                  </clipPath>
                </defs>
                <circle cx="50" cy="50" r="44" fill="#111111"/>
                <circle cx="50" cy="50" r="35" fill="none" stroke="#383838" stroke-width="1.5"/>
                <circle cx="50" cy="50" r="26" fill="none" stroke="#383838" stroke-width="1.5"/>
                <circle cx="50" cy="50" r="19" fill="none" stroke="#383838" stroke-width="1.5"/>
                <circle cx="50" cy="50" r="15" fill="#C0392B"/>
                <circle cx="50" cy="50" r="3.5" fill="#FAF6EF"/>
                <path d="M64,0 L82,0 L82,40 L73,29 L64,40 Z" fill="#C0392B" clip-path="url(#vinyl-clip)"/>
              </svg>
            </div>
            <div>
              <div class="project-name">Earmarked</div>
              <div class="project-desc">Music listening tracker</div>
            </div>
            <span class="arrow">↗</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
