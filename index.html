<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brandt Dudziak</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #fff;
        color: #111;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      main {
        padding: 2rem;
        max-width: 480px;
        width: 100%;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 500;
        margin-bottom: 2rem;
        color: #111;
      }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      a {
        text-decoration: none;
        color: #111;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.875rem 1rem;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        transition: border-color 0.15s, background 0.15s;
      }

      a:hover {
        border-color: #111;
        background: #f9f9f9;
      }

      .project-name {
        font-size: 1rem;
        font-weight: 500;
      }

      .project-desc {
        font-size: 0.8rem;
        color: #888;
        margin-top: 0.2rem;
      }

      .arrow {
        color: #aaa;
        font-size: 0.85rem;
        flex-shrink: 0;
        margin-left: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brandt Dudziak</h1>
      <ul>
        <li>
          <a href="https://ninacsr.com" target="_blank">
            <div>
              <div class="project-name">Nina CSR</div>
              <div class="project-desc">Website for a court reporting service</div>
            </div>
            <span class="arrow">↗</span>
          </a>
        </li>
        <li>
          <a href="https://ludex.brandtdudziak.com" target="_blank">
            <div>
              <div class="project-name">Ludex</div>
              <div class="project-desc">Personal BoardGameGeek collection viewer</div>
            </div>
            <span class="arrow">↗</span>
          </a>
        </li>
        <li>
          <a href="https://earmarked.brandtdudziak.com" target="_blank">
            <div>
              <div class="project-name">Earmarked</div>
              <div class="project-desc">Music listening tracker</div>
            </div>
            <span class="arrow">↗</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
